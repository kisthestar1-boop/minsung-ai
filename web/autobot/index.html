<!doctype html><html lang="ko"><head><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://chalkakhome.com/autobot/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>딸깍봇 · 업무 자동화 (초안)</title>
<style>
:root{--bg:#F6F7FB;--card:#fff;--ink:#16213A;--mu:#6B7790;--ln:#E3E7EF;--ac:#FF7A45;--ok:#22A06B}
*{box-sizing:border-box;margin:0}body{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--ln)}header b{font-size:22px}header small{color:var(--mu)}
.badge{margin-left:auto;font-size:13px;background:#FFF1E9;color:#B4471A;border-radius:99px;padding:4px 12px;font-weight:700}
main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px 24px;min-height:calc(100vh - 66px)}
aside,section{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
h2{font-size:17px;margin-bottom:12px}
.rec{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:800;background:var(--ac);color:#fff;cursor:pointer}
.task{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;cursor:pointer;background:#fff}
.task.on{border-color:var(--ac);background:#FFF7F2}.task i{font-style:normal;font-size:22px}.task b{display:block;font-size:15px}.task small{color:var(--mu);font-size:13px}
.steps{list-style:none;padding:0;margin-top:8px}.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;margin-top:6px;background:#F6F7FB;transition:background .4s,opacity .4s}
.steps li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--ln);font-size:13px;font-weight:800}
.steps li.run{background:#FFF1E9}.steps li.done{background:#E8F6EF}.steps li.done span{background:var(--ok);color:#fff;border-color:var(--ok)}
.go{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;background:var(--ink);color:#fff;cursor:pointer}
.note{margin-top:14px;font-size:13px;color:var(--mu);background:#F6F7FB;border-radius:10px;padding:10px 12px;line-height:1.6}
.md{position:fixed;inset:0;background:rgba(20,30,50,.45);display:grid;place-items:center;animation:f .2s}.md[hidden]{display:none}
.mb{background:#fff;border-radius:16px;padding:20px;width:min(460px,92vw)}.mb input{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;font:inherit}
@keyframes f{from{opacity:0}to{opacity:1}}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>🤖 딸깍봇</b><small>한 번 보여 주면, 다음부터 버튼 하나로</small><span class="badge">초안 · 화면만 먼저</span></header>
<main>
<aside><h2>📋 내 업무</h2><button class="rec" id="rec">⏺ 새 업무 녹화하기</button><div id="list"></div>
<div class="note">💡 크롬에서 평소처럼 한 번 해 보이면, 딸깍봇이 순서를 기억해요.<br>다음부터는 업무를 누르고 ▶ 만 누르면 돼요.</div></aside>
<section><h2 id="tt">업무를 골라 주세요</h2><p id="ds" style="color:var(--mu);font-size:14px"></p><ul class="steps" id="st"></ul>
<div style="display:flex;gap:10px;margin-top:16px"><button class="go" id="go" hidden>▶ 이 업무 실행</button></div>
<div class="note" id="info">⚙️ 실제 녹화·실행은 다음 단계에서 <b>크롬 확장 프로그램</b>으로 붙여요. 지금 초안은 화면과 흐름만 보여 드려요.</div></section>
</main>
<div class="md" id="md" hidden><div class="mb"><b style="font-size:17px">⏺ 새 업무 녹화</b><p style="color:var(--mu);font-size:14px;margin-top:6px">업무 이름을 적고 시작을 누르면, 크롬에서 하는 클릭·입력이 순서대로 기록돼요.</p><input id="nm" placeholder="예: 매일 아침 주문 엑셀 내려받기"><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="go" style="background:#E3E7EF;color:#16213A" id="cx">취소</button><button class="go" style="background:var(--ac)" id="ok">녹화 시작 (예시)</button></div></div></div>
<script>
const T=[{i:"📦",n:"주문 엑셀 내려받기",d:"매일 아침 · 쇼핑몰 관리자",s:["쇼핑몰 관리자 열기","주문 관리 → 오늘 주문","엑셀 내려받기 누르기","내 PC '주문' 폴더에 저장"]},
{i:"📧",n:"문의 메일 확인",d:"하루 2번 · 네이버 메일",s:["네이버 메일 열기","'문의' 편지함 열기","새 메일 제목 모아 보기","표로 정리해 보여 주기"]},
{i:"🧾",n:"세금계산서 조회",d:"매주 월요일 · 홈택스",s:["홈택스 열기 (로그인은 직접)","전자세금계산서 → 조회","지난주 날짜 고르기","목록을 엑셀로 저장"]}];
let cur=-1,run=0;const $=s=>document.querySelector(s);
function list(){$("#list").innerHTML=T.map((t,i)=>`<div class="task${i===cur?" on":""}" data-i="${i}"><i>${t.i}</i><span><b>${t.n}</b><small>${t.d} · ${t.s.length}단계</small></span></div>`).join("")}
function show(){const t=T[cur];$("#tt").textContent=t.i+" "+t.n;$("#ds").textContent=t.d;$("#st").innerHTML=t.s.map((s,k)=>`<li><span>${k+1}</span>${s}</li>`).join("");$("#go").hidden=false}
document.addEventListener("click",e=>{const k=e.target.closest(".task");if(k&&!run){cur=+k.dataset.i;list();show()}});
$("#go").onclick=async()=>{if(run)return;run=1;const L=[...document.querySelectorAll("#st li")];L.forEach(l=>l.className="");for(const l of L){l.className="run";await new Promise(r=>setTimeout(r,900));l.className="done"}$("#go").textContent="✅ 끝났어요 · 다시 실행";run=0};
$("#rec").onclick=()=>{$("#md").hidden=false;$("#nm").focus()};$("#cx").onclick=()=>$("#md").hidden=true;
$("#ok").onclick=()=>{const n=$("#nm").value.trim()||"새 업무";T.push({i:"⏺",n,d:"방금 녹화 (예시)",s:["사이트 열기","버튼 누르기","글 입력하기","저장하기"]});$("#md").hidden=true;cur=T.length-1;list();show()};
list();
</script></body></html>
