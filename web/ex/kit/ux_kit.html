<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://chalkakhome.com/ex/kit/ux_kit.html"><!--UXKIT v1 (삼흥테크 방식: 스크롤 차분 등장 · 눌러서 크게 보기)-->
<style id="uxk-css">
html{scroll-behavior:smooth}section[id]{scroll-margin-top:84px}
header.uxk-sc{box-shadow:0 6px 22px rgba(0,0,0,.08);transition:box-shadow .3s ease}
.uxk-r{opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.uxk-r.uxk-on{opacity:1;transform:none}
.uxk-p{cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.uxk-p:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.12)}
.uxk-p:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.uxk-hint{display:block;margin-top:8px;font-size:12.5px;font-weight:800;opacity:.55}
nav a.uxk-act{opacity:1;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
#uxk-md{position:fixed;inset:0;z-index:200;background:rgba(15,15,25,.55);display:grid;place-items:center;padding:14px}
#uxk-md[hidden]{display:none}
#uxk-md:not([hidden]){animation:uxkF .22s ease both}
#uxk-md .mb{background:#fff;color:#222;border-radius:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:26px 24px 22px;position:relative;animation:uxkM .26s ease both;word-break:keep-all}
#uxk-md .mb>.cx{position:absolute;right:12px;top:12px;border:0;background:#f1f1f4;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
#uxk-md .bd{font-size:17px;line-height:1.75}#uxk-md .bd img{max-width:100%;border-radius:14px}
#uxk-md .bd .uxk-hint{display:none}
#uxk-md .bd .im{aspect-ratio:16/10;background-size:cover;background-position:center;border-radius:14px;margin-bottom:14px}#uxk-md .bd h3{font-size:22px;margin:4px 0 6px}
#uxk-md .ft{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
#uxk-md .ft button,#uxk-md .ft a{font:inherit;font-weight:800;border-radius:99px;padding:11px 18px;border:2px solid #e6e6ea;background:#fff;color:#222;cursor:pointer;text-decoration:none}
#uxk-md .ft .go{background:var(--uxk-c,#222);border-color:transparent;color:#fff;margin-left:auto}
@keyframes uxkF{from{opacity:0}}@keyframes uxkM{from{opacity:0;transform:scale(.985)}}
@media (prefers-reduced-motion:reduce){.uxk-r{opacity:1!important;transform:none!important}#uxk-md,#uxk-md .mb{animation:none!important}.uxk-p:hover{transform:none}}
</style>
<div id="uxk-md" hidden role="dialog" aria-modal="true"><div class="mb"><button class="cx" aria-label="닫기">✕</button><div class="bd"></div><div class="ft"></div></div></div>
<script>
(()=>{const C=Object.assign({reveal:'section h2,section .lead,.card,blockquote,details,.gal,form,.map,table,.cl,.tc,.rv,.fq,.sh,.price,figure',
 pop:'.card,.cl,.tc',cta:'#apply,#book,#ask,#contact',ctaText:'체험 수업 신청하기'},window.UXK||{});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const hdr=$('header');addEventListener('scroll',()=>hdr&&hdr.classList.toggle('uxk-sc',scrollY>10),{passive:true});
// 메뉴 현재 위치 표시
const links=$$('nav a[href^="#"]');if(links.length&&'IntersectionObserver' in window){const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('uxk-act',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});links.forEach(a=>{const t=document.getElementById(a.getAttribute('href').slice(1));t&&io2.observe(t)})}
// 눌러서 크게 보기
const md=$('#uxk-md'),bd=md.querySelector('.bd'),ft=md.querySelector('.ft');let list=[],cur=0;
const cta=C.cta.split(',').map(s=>$(s)).find(Boolean);
const col=getComputedStyle(document.documentElement);['--c1','--pk','--a','--sg2','--or','--p','--main'].some(v=>{const x=col.getPropertyValue(v).trim();if(x){md.style.setProperty('--uxk-c',x);return true}});
function show(i){cur=i;const el=list[i];bd.innerHTML=el.innerHTML;bd.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
 ft.innerHTML=(i>0?'<button data-uxk="-1">← 이전</button>':'')+(i<list.length-1?'<button data-uxk="1">다음 →</button>':'')+(cta?`<button class="go" data-uxk="go">${C.ctaText}</button>`:'');}
function open(el){list=$$(C.pop).filter(x=>x.parentElement===el.parentElement);show(list.indexOf(el));md.hidden=false;document.body.style.overflow='hidden';md.querySelector('.cx').focus()}
function close(){md.hidden=true;document.body.style.overflow=''}
(C.pop?$$(C.pop):[]).forEach(el=>{if(el.closest('form,a,button,#uxk-md')||el.querySelector('form,input,select'))return;el.classList.add('uxk-p');el.tabIndex=0;el.setAttribute('role','button');
 if(!el.querySelector('.uxk-hint'))el.insertAdjacentHTML('beforeend','<small class="uxk-hint">눌러서 자세히 보기 ›</small>');
 el.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea,label'))return;open(el)});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(el)}})});
md.addEventListener('click',e=>{const b=e.target.closest('[data-uxk]');if(e.target===md||e.target.closest('.cx'))return close();if(!b)return;
 if(b.dataset.uxk==='go'){close();cta.scrollIntoView({behavior:'smooth'});const f=cta.querySelector('input,select,textarea');f&&setTimeout(()=>f.focus({preventScroll:true}),700)}else show(cur+ +b.dataset.uxk)});
addEventListener('keydown',e=>{if(md.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight'&&cur<list.length-1)show(cur+1);if(e.key==='ArrowLeft'&&cur>0)show(cur-1)});
// 스크롤 차분 등장
if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const done=el=>setTimeout(()=>{el.classList.remove('uxk-r','uxk-on');el.style.removeProperty('--d')},1300);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('uxk-on');done(e.target);io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
const g=new Map();$$(C.reveal).filter(e=>!e.closest('.hero,header,#uxk-md')).forEach(e=>{const p=e.parentElement,i=g.get(p)||0;g.set(p,i+1);e.style.setProperty('--d',Math.min(i,6)*.07+'s');e.classList.add('uxk-r');
 if(e.getBoundingClientRect().top<innerHeight*.92)requestAnimationFrame(()=>{e.classList.add('uxk-on');done(e)});else io.observe(e)});})();
</script>
