<body><canvas id="cv"></canvas>
<script src="../sprout/data.js?v=79"></script>
<script type="module">
import { Game, VERSION } from './src/game.js';
import { Adventure } from './game/adventure.js';
import { Journey } from './game/journey.js';
const game = new Game(document.getElementById('cv'), { assetBase: '../sprout/img/', assetVer: '79', data: { HEROES, HUS, RPGMAP, MAPS, MONINFO, MONSTAT, WB, TRN, TRJ, TRREC, SKILLDEF, GROW, CAMPRULE } });
game.scenes.add('adventure', Adventure); game.scenes.add('journey', Journey);
const q = new URLSearchParams(location.search), hero = q.get('hero') || 'c_sum';
game.start('adventure', { hero, map: q.get('map') || 'world' });
window.__E = { game, VERSION };
</script></body></html>
